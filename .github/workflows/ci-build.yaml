name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8 pylint nose coverage

      - name: Lint with Flake8
        run: flake8 service tests

      - name: Lint with Pylint
        run: pylint service tests

      - name: Run unit tests with nosetests
        run: nosetests -v --with-coverage --cover-package=service tests
