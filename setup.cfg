[nosetests]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1

[coverage:run]
branch = True
source = .

[coverage:report]
show_missing = True
omit =
    */tests/*
    */test_*.py
    */venv/*
    */.venv/*

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv,build,dist
extend-ignore = E203,W503

[pylint.MASTER]
ignore = .git,venv,.venv

[pylint.FORMAT]
max-line-length = 100

[pylint.MESSAGES CONTROL]
disable = missing-module-docstring
