[nosetests]
verbosity = 2
with-spec = 1
spec-color = 1
with-coverage = 1
cover-package = service
cover-erase = 1

[coverage:run]
branch = True
source = .

[coverage:report]
show_missing = True
omit =
    */tests/*
    */test_*.py
    */venv/*
    */.venv/*

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,.venv311,venv,build,dist
extend-ignore = E203,W503
per-file-ignores =
    __init__.py:F401

[pylint.MASTER]
ignore = .git,venv,.venv,.venv311

[pylint.FORMAT]
max-line-length = 100

[pylint.MESSAGES CONTROL]
disable = missing-module-docstring,E1101

[pylint]
disable = E1101
