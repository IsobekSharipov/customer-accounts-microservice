apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-accounts
  labels:
    app: customer-accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-accounts
  template:
    metadata:
      labels:
        app: customer-accounts
    spec:
      containers:
        - name: customer-accounts
          image: customer-accounts:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
